<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanksgiving 2026</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #faf6ef;
  --surface: #fffdf9;
  --ink: #2b211b;
  --muted: #6f6157;
  --rule: #e4d9cb;
  --accent: #9b2335;
  --accent-soft: #f6e4e3;
  --ahead: #2f5d4e;
  --ahead-soft: #e5efe9;
  --done: #a89a8e;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1714;
    --surface: #241f1b;
    --ink: #f1e9df;
    --muted: #b3a597;
    --rule: #3a322b;
    --accent: #e07a84;
    --accent-soft: #3a2326;
    --ahead: #8cc7b1;
    --ahead-soft: #1f302a;
    --done: #6d625a;
    color-scheme: dark;
  }
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
  font-size: 18px;
  line-height: 1.5;
}

input,
textarea {
  font-size: 16px;
}

a {
  color: var(--accent);
}

button {
  font: inherit;
  color: inherit;
}

main {
  max-width: 44rem;
  margin: 0 auto;
  padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(4rem, env(safe-area-inset-bottom));
}

/* Menu view */

.menu-header {
  text-align: center;
  padding-block: 2.5rem 1.5rem;
}

.eyebrow {
  margin: 0;
  font-size: 0.8rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: bold;
}

.menu-header h1 {
  margin: 0.5rem 0 0.25rem;
  font-size: clamp(2.4rem, 9vw, 3.6rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
}

.menu-header .date {
  margin: 0;
  color: var(--muted);
}

.ornament {
  display: block;
  width: 4rem;
  height: 2px;
  margin: 1.75rem auto 0;
  background: var(--accent);
}

.menu {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--rule);
}

.menu li {
  border-bottom: 1px solid var(--rule);
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.1rem 0.25rem;
  color: inherit;
  text-decoration: none;
}

a.menu-item:hover .dish,
a.menu-item:focus-visible .dish {
  color: var(--accent);
}

.menu-text {
  flex: 1;
  min-width: 0;
}

.dish {
  display: block;
  font-size: 1.45rem;
  font-weight: bold;
  letter-spacing: -0.01em;
}

.dish-meta {
  display: block;
  margin-top: 0.15rem;
  font-size: 0.9rem;
  color: var(--muted);
}

.dish-meta .ahead-note {
  color: var(--ahead);
}

.chevron {
  flex: none;
  font-size: 1.5rem;
  color: var(--accent);
}

.no-recipe {
  font-size: 0.8rem;
  color: var(--muted);
  flex: none;
}

.menu-footer {
  margin-top: 2rem;
  text-align: center;
  font-size: 0.85rem;
  color: var(--muted);
}

/* Recipe view */

.toolbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin: -0.5rem -1.25rem 0;
  padding: 0.6rem 1.25rem;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
}

.back {
  font-weight: bold;
  text-decoration: none;
  padding: 0.35rem 0;
}

.toolbar-actions {
  display: flex;
  gap: 0.5rem;
}

.chip {
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 999px;
  padding: 0.35rem 0.85rem;
  font-size: 0.85rem;
  cursor: pointer;
}

.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--surface);
}

.recipe-header {
  padding-top: 2rem;
}

.recipe-header h1 {
  margin: 0.4rem 0 0.25rem;
  font-size: clamp(2rem, 7vw, 2.8rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
}

.subtitle {
  margin: 0;
  color: var(--muted);
}

.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.75rem;
  margin: 1.25rem 0 0;
  padding: 0;
}

.facts div {
  display: flex;
  flex-direction: column;
}

.facts dt {
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.facts dd {
  margin: 0;
  font-weight: bold;
}

.ahead {
  margin-top: 1.75rem;
  padding: 1rem 1.25rem;
  background: var(--ahead-soft);
  border-left: 4px solid var(--ahead);
  border-radius: 0 0.5rem 0.5rem 0;
}

.ahead h2 {
  margin: 0 0 0.5rem;
  font-size: 1.05rem;
  color: var(--ahead);
}

.ahead h3 {
  margin: 0.85rem 0 0.2rem;
  font-size: 0.95rem;
}

.ahead h3 + p,
.ahead h3 + h4 {
  margin-top: 0;
}

.ahead h4 {
  margin: 0.75rem 0 0.2rem;
  font-size: 0.9rem;
  color: var(--muted);
}

.ahead p {
  margin: 0 0 0.5rem;
}

.ahead ul,
.ahead ol {
  margin: 0.25rem 0 0.5rem;
  padding-left: 1.4rem;
}

.ahead li {
  margin-bottom: 0.2rem;
}

.ahead h3:not(:first-of-type) {
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid color-mix(in srgb, var(--ahead) 30%, transparent);
}

.table-wrap {
  overflow-x: auto;
  margin: 0.25rem 0 0.75rem;
}

.table-wrap table {
  border-collapse: collapse;
  min-width: 16rem;
  font-size: 0.95rem;
}

.table-wrap th,
.table-wrap td {
  padding: 0.3rem 1.5rem 0.3rem 0;
  text-align: left;
  border-bottom: 1px solid color-mix(in srgb, var(--ahead) 25%, transparent);
}

.table-wrap th {
  font-size: 0.75rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: normal;
}

.table-wrap td:first-child {
  font-weight: bold;
}

.recipe-section h2 {
  margin: 2.5rem 0 0.75rem;
  padding-bottom: 0.4rem;
  font-size: 1.35rem;
  border-bottom: 2px solid var(--ink);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
}

.progress {
  font-size: 0.85rem;
  font-weight: normal;
  color: var(--muted);
}

.ingredient-group h3 {
  margin: 1.25rem 0 0.25rem;
  font-size: 1rem;
  color: var(--accent);
}

.checklist {
  list-style: none;
  margin: 0;
  padding: 0;
}

.checklist label {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
}

.checklist input {
  flex: none;
  width: 1.3rem;
  height: 1.3rem;
  margin: 0.15rem 0 0;
  accent-color: var(--accent);
}

.checklist input:checked + span {
  color: var(--done);
  text-decoration: line-through;
}

.steps {
  list-style: none;
  margin: 0;
  padding: 0;
  counter-reset: step;
}

.step {
  counter-increment: step;
  position: relative;
  padding: 1rem 0 1rem 3.25rem;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
}

.step::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 1rem;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: bold;
}

.step.done::before {
  content: "✓";
  background: var(--accent);
  color: var(--surface);
}

.step.done .step-body {
  color: var(--done);
}

.step h3 {
  margin: 0 0 0.25rem;
  font-size: 1.1rem;
}

.step p {
  margin: 0 0 0.5rem;
}

.step p:last-child {
  margin-bottom: 0;
}

.step-hint {
  font-size: 0.85rem;
  color: var(--muted);
  margin: 0.5rem 0 0;
}

details.more {
  margin-top: 2.5rem;
  border-top: 2px solid var(--ink);
}

details.more summary {
  cursor: pointer;
  padding: 0.75rem 0;
  font-size: 1.15rem;
  font-weight: bold;
}

.article-section h3 {
  margin: 1.25rem 0 0.35rem;
  font-size: 1.05rem;
}

.article-section h4 {
  margin: 0.85rem 0 0.25rem;
  font-size: 0.95rem;
}

.article-section p,
.article-section li {
  color: var(--muted);
}

.article-section p {
  margin: 0 0 0.6rem;
}

.article-section ul {
  margin: 0 0 0.75rem;
  padding-left: 1.2rem;
}

.lead {
  color: var(--ink);
  font-weight: bold;
}

.source {
  margin-top: 2.5rem;
  font-size: 0.85rem;
  color: var(--muted);
}

@media (max-width: 30rem) {
  body {
    font-size: 17px;
  }

  .toolbar {
    margin-inline: -1.25rem;
  }

  .dish {
    font-size: 1.25rem;
  }
}

@media print {
  .toolbar,
  details.more {
    display: none;
  }

  .step {
    break-inside: avoid;
  }
}
</style>

        "heading": "Our Tips for the Best Mashed Potatoes",

          {

            "content": "Mashed potatoes are fairly easy, but even experienced makers need some good advice from time to time:"

            "content": [
              {
                "lead": "Don't cut tiny potato pieces:",
                "text": "You may be tempted to speed up cooking by cutting tiny pieces of potatoes, but that's not a great idea if you want delicious mashed potatoes. The smaller pieces will cook quickly, yes, but they'll also absorb more water. Stick with pieces about 1 inch square."

            "type": "p",
            "content": "For mashing, however, opt for a starchier potato, such as Yukon gold potatoes or russet potatoes—these high-starch potatoes will result in a smooth, fluffy mash. Our Test Kitchen loves to use Yukon gold potatoes because they're creamy, rich, and buttery—all qualities that we're looking for in our mashed potatoes."

        "heading": "Homemade Mashed Potato Ingredients",

            "content": "Get the full recipe for these mashed potatoes further below. For now, here's a brief outline to give you an idea of how this side dish is made:"

            "content": "Yes, you can peel and cut the potatoes for mashed potatoes ahead of time to save as much time as possible. Simply peel and dice the potatoes into 1-inch cubes the day before you plan to make the mashed potatoes, then soak the cut potatoes in a bowl of water overnight in the refrigerator."

  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === null || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'text') node.textContent = value;
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(child));
  }
  return node;
}

// --- Checklist progress, remembered per recipe in this browser ------------

function loadProgress(id) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + id);
    const parsed = raw ? JSON.parse(raw) : {};
    return { ingredients: parsed.ingredients || [], steps: parsed.steps || [] };
  } catch {
    return { ingredients: [], steps: [] };
  }
}

function saveProgress(id, progress) {
  try {
    localStorage.setItem(STORAGE_PREFIX + id, JSON.stringify(progress));
  } catch {
    // Storage can be unavailable (private mode, blocked site data); progress just won't persist.
  }
}

// --- Keep the screen awake while cooking ----------------------------------

let wakeLock = null;
let wantWakeLock = false;

async function requestWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      wakeLock = null;
    });
  } catch {
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (wantWakeLock && !wakeLock && document.visibilityState === 'visible') requestWakeLock();
});

// --- Helpers for recipe content -------------------------------------------

function summaryFor(recipe) {
  const parts = [];
  const time = recipe.details['Total Time'] || recipe.details['Bake Time'];
  if (time) parts.push(time.trim());
  if (recipe.details.Servings) parts.push(`serves ${recipe.details.Servings.trim()}`);
  return parts.join(' · ');
}

function sentenceCase(text) {
  // Southern Living headings are in Title Case; show them in sentence case.
  const keepCaps = new Set([
    'I', 'I\'m', 'Southern', 'Living', 'French’s', 'Italian',
    'Sister', 'Schubert\'s', 'Sara', 'Lee', 'Dutch'
  ]);
  return text
    .split(' ')
    .map((word, i) => {
      if (i === 0) return word.charAt(0).toUpperCase() + word.slice(1);
      if (keepCaps.has(word.replace(/[?:,.]$/, ''))) return word;
      return word.toLowerCase();
    })
    .join(' ');
}

function renderBlocks(blocks, headingTag) {
  return blocks.map((block) => {
    if (block.type === 'table') {
      return el('div', { class: 'table-wrap' },
        el('table', {},
          el('thead', {}, el('tr', {}, block.head.map((cell) => el('th', { scope: 'col', text: cell })))),
          el('tbody', {}, block.rows.map((row) => el('tr', {}, row.map((cell) => el('td', { text: cell })))))
        )
      );
    }
    if (block.type === 'list') {
      return el(block.ordered ? 'ol' : 'ul', {}, block.content.map((item) =>
        el('li', {}, item.lead ? el('span', { class: 'lead', text: item.lead + ' ' }) : null, item.text)
      ));
    }
    if (block.type === 'h3') return el(headingTag, { text: sentenceCase(block.content) });
    return el('p', { text: block.content });
  });
}

// --- Views ----------------------------------------------------------------

function renderMenu() {
  document.title = 'Thanksgiving 2026';
  app.replaceChildren(
    el('header', { class: 'menu-header' },
      el('p', { class: 'eyebrow', text: 'Menu' }),
      el('h1', { text: 'Thanksgiving dinner' }),
      el('p', { class: 'date', text: 'Thursday, November 26, 2026' }),
      el('span', { class: 'ornament', 'aria-hidden': 'true' })
    ),
    el('ul', { class: 'menu' }, menu.map((item) => {
      const recipe = item.recipe && recipes[item.recipe];
      if (!recipe) {
        return el('li', {},
          el('div', { class: 'menu-item' },
            el('span', { class: 'menu-text' }, el('span', { class: 'dish', text: item.name })),
            el('span', { class: 'no-recipe', text: 'No recipe yet' })
          )
        );
      }
      const note = item.ahead;
      const summary = summaryFor(recipe);
      return el('li', {},
        el('a', { class: 'menu-item', href: `#/${item.recipe}` },
          el('span', { class: 'menu-text' },
            el('span', { class: 'dish', text: item.name }),
            el('span', { class: 'dish-meta' },
              summary,
              summary && note ? ' · ' : '',
              note ? el('span', { class: 'ahead-note', text: note }) : null
            )
          ),
          el('span', { class: 'chevron', 'aria-hidden': 'true', text: '›' })
        )
      );
    })),
    el('p', { class: 'menu-footer', text: 'Tap a dish to open its recipe.' })
  );
  window.scrollTo(0, 0);
}

function renderRecipe(id) {
  const recipe = recipes[id];
  const menuItem = menu.find((item) => item.recipe === id);
  const progress = loadProgress(id);
  document.title = `${menuItem ? menuItem.name : recipe.title} · Thanksgiving 2026`;

  // Toolbar
  const wakeButton = 'wakeLock' in navigator
    ? el('button', {
        class: 'chip',
        type: 'button',
        'aria-pressed': String(wantWakeLock),
        text: 'Keep screen on',
        onclick: async (event) => {
          wantWakeLock = !wantWakeLock;
          event.currentTarget.setAttribute('aria-pressed', String(wantWakeLock));
          if (wantWakeLock) await requestWakeLock();
          else if (wakeLock) await wakeLock.release();
        }
      })
    : null;
  const resetButton = el('button', {
    class: 'chip',
    type: 'button',
    text: 'Reset checks',
    onclick: () => {
      saveProgress(id, { ingredients: [], steps: [] });
      renderRecipe(id);
    }
  });

  // Facts
  const facts = el('dl', { class: 'facts' },
    Object.entries(recipe.details).map(([label, value]) =>
      el('div', {}, el('dt', { text: label }), el('dd', { text: value.trim() }))
    )
  );

  // Make-ahead and storage notes go up top, where they're useful for planning.
  const aheadSections = recipe.sections.filter((s) => s.kind === 'make-ahead' || s.kind === 'storage');
  const ahead = aheadSections.length
    ? el('aside', { class: 'ahead', 'aria-label': 'Make ahead' },
        el('h2', { text: 'Make ahead' }),
        aheadSections.map((section) => [
          aheadSections.length > 1 ? el('h3', { text: sentenceCase(section.heading) }) : null,
          renderBlocks(section.blocks, aheadSections.length > 1 ? 'h4' : 'h3')
        ])
      )
    : null;

  // Ingredients checklist
  const ingredientCount = recipe.ingredients.reduce((n, g) => n + g.items.length, 0);
  const ingredientProgress = el('span', { class: 'progress' });
  const updateIngredientProgress = () => {
    ingredientProgress.textContent = `${progress.ingredients.length} of ${ingredientCount} ready`;
  };
  updateIngredientProgress();
  const ingredients = el('section', { class: 'recipe-section' },
    el('h2', {}, 'Ingredients', ingredientProgress),
    recipe.ingredients.map((group, g) =>
      el('div', { class: 'ingredient-group' },
        group.heading ? el('h3', { text: sentenceCase(group.heading) }) : null,
        el('ul', { class: 'checklist' }, group.items.map((item, i) => {
          const key = `${g}.${i}`;
          return el('li', {},
            el('label', {},
              el('input', {
                type: 'checkbox',
                checked: progress.ingredients.includes(key),
                onchange: (event) => {
                  progress.ingredients = progress.ingredients.filter((k) => k !== key);
                  if (event.target.checked) progress.ingredients.push(key);
                  saveProgress(id, progress);
                  updateIngredientProgress();
                }
              }),
              el('span', { text: item })
            )
          );
        }))
      )
    )
  );

  // Steps: tap a step to mark it done.
  const stepProgress = el('span', { class: 'progress' });
  const updateStepProgress = () => {
    stepProgress.textContent = `${progress.steps.length} of ${recipe.steps.length} done`;
  };
  updateStepProgress();
  const steps = el('section', { class: 'recipe-section' },
    el('h2', {}, 'Directions', stepProgress),
    el('ol', { class: 'steps' }, recipe.steps.map((step, i) => {
      const item = el('li', {
        class: progress.steps.includes(i) ? 'step done' : 'step',
        role: 'checkbox',
        tabindex: '0',
        'aria-checked': String(progress.steps.includes(i))
      },
        el('div', { class: 'step-body' },
          step.title ? el('h3', { text: sentenceCase(step.title) }) : null,
          step.paragraphs.map((p) => el('p', { text: p }))
        )
      );
      const toggle = () => {
        const done = !progress.steps.includes(i);
        progress.steps = progress.steps.filter((n) => n !== i);
        if (done) progress.steps.push(i);
        item.classList.toggle('done', done);
        item.setAttribute('aria-checked', String(done));
        saveProgress(id, progress);
        updateStepProgress();
      };
      item.addEventListener('click', (event) => {
        if (!window.getSelection().isCollapsed) return;
        toggle();
      });
      item.addEventListener('keydown', (event) => {
        if (event.key === ' ' || event.key === 'Enter') {
          event.preventDefault();
          toggle();
        }
      });
      return item;
    })),
    el('p', { class: 'step-hint', text: 'Tap a step to mark it done.' })
  );

  // Everything else from the article, tucked away.
  const otherSections = recipe.sections.filter((s) => s.kind !== 'make-ahead' && s.kind !== 'storage');
  const tipsFirst = [...otherSections].sort((a, b) => (b.kind === 'tips') - (a.kind === 'tips'));
  const more = otherSections.length
    ? el('details', { class: 'more' },
        el('summary', { text: 'Tips and notes from the article' }),
        tipsFirst.map((section) =>
          el('section', { class: 'article-section' },
            el('h3', { text: sentenceCase(section.heading) }),
            renderBlocks(section.blocks, 'h4')
          )
        )
      )
    : null;

  // Optional parts (ahead, more) may be null; replaceChildren would render that as "null".
  app.replaceChildren(...[
    el('nav', { class: 'toolbar' },
      el('a', { class: 'back', href: '#/' }, '‹ Menu'),
      el('div', { class: 'toolbar-actions' }, wakeButton, resetButton)
    ),
    el('header', { class: 'recipe-header' },
      el('p', { class: 'eyebrow', text: menuItem ? menuItem.name : 'Recipe' }),
      el('h1', { text: sentenceCase(recipe.title) }),
      recipe.subtitle ? el('p', { class: 'subtitle', text: recipe.subtitle }) : null,
      facts
    ),
    ahead,
    ingredients,
    steps,
    more,
    el('p', { class: 'source' },
      'From ',
      el('a', { href: recipe.source, target: '_blank', rel: 'noopener', text: recipe.sourceName || 'Southern Living' }),
      ` · saved ${recipe.fetched}`
    )
  ].filter(Boolean));
  window.scrollTo(0, 0);
}

// --- Routing --------------------------------------------------------------

function route() {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  if (id && recipes[id]) renderRecipe(id);
  else renderMenu();
}

window.addEventListener('hashchange', route);
route();
</script>

</html>
